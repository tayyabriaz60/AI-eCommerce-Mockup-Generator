databases:
  - name: ai-mockup-db
    plan: free
    databaseName: ai_mockup
    user: ai_mockup_user

services:
  - type: web
    name: ai-mockup-generator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-image
      - key: DATABASE_URL
        fromDatabase:
          name: ai-mockup-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:8000
