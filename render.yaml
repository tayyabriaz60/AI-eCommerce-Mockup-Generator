databases:
  - name: ai-mockup-db
    plan: free
    databaseName: ai_mockup
    user: ai_mockup_user

services:
  - type: web
    name: ai-mockup-generator
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-image
      - key: DATABASE_URL
        fromDatabase:
          name: ai-mockup-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:8000
      - key: PYTHON_VERSION
        value: 3.11.9
