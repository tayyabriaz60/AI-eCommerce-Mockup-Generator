databases:
  - name: ai-mockup-db
    plan: free
    databaseName: ai_mockup
    user: ai_mockup_user

services:
  - type: web
    name: ai-mockup-generator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: black-forest-labs/FLUX.1-Kontext-dev
      - key: DATABASE_URL
        fromDatabase:
          name: ai-mockup-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:8000
